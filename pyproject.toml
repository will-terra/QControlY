[project]
name = "qcy-h3"
version = "0.1.0"
description = "Gerenciador desktop multiplataforma para QCY H3 / H3 Pro / H3S"
requires-python = ">=3.10"
dependencies = [
  "bleak>=0.22",
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
qcy-h3 = "qcyh3.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcyh3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
